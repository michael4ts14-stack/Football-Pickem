name: Official form map (Google Form -> Firestore)

# Reads this week's official Separated at Turf Google Form (read-only, nothing is submitted)
# and writes live_games/week_N_form so the app can open a pre-filled copy of the form.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["tools/form/**", "tools/lib/**", "tests/form/**", ".github/workflows/form.yml"]

concurrency:
  group: official-form
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "tests/form/*.test.mjs"
      - name: Dry run (pull request)
        if: github.event_name == 'pull_request'
        run: node tools/form/build-form.mjs --dry-run
      - name: Read the form and write to Firestore
        if: github.event_name != 'pull_request'
        env:
          # Dedicated Firestore-only service account, not the hosting-deploy key (BUGS.md B22).
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
          FIRESTORE_AUTH_REQUIRED: "true"
        run: node tools/form/build-form.mjs
