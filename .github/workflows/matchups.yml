name: Matchup data (ESPN -> Firestore)

# Builds live_games/week_N_matchups for the Picks detail sheet. Runs on GitHub's servers
# because ESPN often refuses Google's Apps Script servers. Hourly runs exit in seconds unless
# a daily refresh is due (every 20 h) or a game is about 2 hours from kickoff.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Full refresh now"
        type: boolean
        default: false
  pull_request:
    paths: ["tools/matchups/**", "tools/lib/**", "tests/matchups/**", ".github/workflows/matchups.yml"]

concurrency:
  group: matchups
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "tests/matchups/*.test.mjs"
      # Pull requests that change this job only prove ESPN answers GitHub's servers: nothing is written.
      - name: Dry run (pull request)
        if: github.event_name == 'pull_request'
        run: node tools/matchups/build-matchups.mjs --dry-run --force --out matchups-preview.json
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: matchups-preview
          path: matchups-preview.json
      - name: Build and write to Firestore
        if: github.event_name != 'pull_request'
        env:
          # Required: firestore.rules only let a service account write live_games (BUGS.md B22).
          # Dedicated Firestore-only account, not the hosting-deploy key.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
          FIRESTORE_AUTH_REQUIRED: "true"
        run: node tools/matchups/build-matchups.mjs ${{ inputs.force && '--force' || '' }}
